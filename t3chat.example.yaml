version: 1.2.1

cache: true

appTitle: "T3Chat (Development)"

interface:
    modelSelect: true
    endpointsMenu: true
    presets: true
    prompts: true
    bookmarks: true
    multiConvo: true
    agents: true

endpoints:
    openAI:
        displayName: "OpenAI"
        apiKey: "${OPENAI_API_KEY}"
        models:
            fetch: false
            default:
                - "gpt-4o"
                - "gpt-4-turbo"

    anthropic:
        displayName: "Anthropic"
        apiKey: "${ANTHROPIC_API_KEY}"
        models:
            fetch: false
            default:
                - "claude-3-5-sonnet"
                - "claude-3-haiku"

    google:
        displayName: "Google Gemini"
        apiKey: "${GOOGLE_API_KEY}"
        models:
            fetch: false
            default:
                - "gemini-1.5-flash"

    custom:
        - name: "OpenRouter"
          apiKey: "${OPENROUTER_API_KEY}"
          baseURL: "https://openrouter.ai/api/v1"
          models:
              fetch: true
              default: []
          modelDisplayLabel: "OpenRouter"
          dropParams: ["stop"]

        - name: "ChatLLM"
          apiKey: "${ABACUS_API_KEY}"
          baseURL: "https://routellm.abacus.ai/v1"
          models:
              fetch: true
              default: []
          modelDisplayLabel: "ChatLLM"

        - name: "AWS Bedrock"
          apiKey: "dummy"
          baseURL: "https://bedrock-runtime.amazonaws.com"
          models:
              fetch: false
              default:
                  - "anthropic.claude-3-haiku-20240307-v1:0"
          modelDisplayLabel: "AWS Bedrock"

modelSpecs:
    - name: "gpt4o-default"
      label: "GPT-4o Default"
      description: "Balanced, multimodal capable model suitable for most chats."
      preset:
          endpoint: "openAI"
          model: "gpt-4o"

    - name: "claude-sonnet"
      label: "Claude 3.5 Sonnet"
      description: "Anthropic's recommended balanced model."
      preset:
          endpoint: "anthropic"
          model: "claude-3-5-sonnet"

    - name: "gemini-flash"
      label: "Gemini 1.5 Flash"
      description: "Fast, lower cost multimodal generations."
      preset:
          endpoint: "google"
          model: "gemini-1.5-flash"
