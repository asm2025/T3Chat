# --------------------------------------------------------------------------------------
# T3Chat Configuration Example (`t3chat.example.yaml`)
#
# This file is based on LibreChat's `librechat.example.yaml` and uses the same
# configuration syntax. For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml
#
# Compatibility / Loading Behavior:
# - The configuration schema is fully compatible with LibreChat's `librechat.yaml` format.
# - The T3Chat server will load `t3chat.yaml` if present in the current working directory.
# - If `t3chat.yaml` is not found, the server will fall back to `librechat.yaml`.
# - You can also override the config path via environment variables:
#   - T3CHAT_CONFIG_FILE (primary)
#   - T3CHAT_CONFIG (alternative)
# --------------------------------------------------------------------------------------

# Cache settings: Set to true to enable caching
cache: true

# File storage configuration
# Single strategy for all file types (legacy format, still supported)
# fileStrategy: "s3"

# Granular file storage strategies (new format - recommended)
# Allows different storage strategies for different file types
# fileStrategy:
#   avatar: "s3"        # Storage for user/agent avatar images
#   image: "firebase"   # Storage for uploaded images in chats
#   document: "local"   # Storage for document uploads (PDFs, text files, etc.)

# Available strategies: "local", "s3", "firebase"
# If not specified, defaults to "local" for all file types
# You can mix and match strategies based on your needs:
# - Use S3 for avatars for fast global access
# - Use Firebase for images with automatic optimization
# - Use local storage for documents for privacy/compliance

# Custom interface configuration
interface:
    # customWelcome: 'Welcome to T3Chat! Enjoy your experience.'
    # Enable/disable file search as a chatarea selection (default: true)
    # Note: This setting does not disable the Agents File Search Capability.
    # To disable the Agents Capability, see the Agents Endpoint configuration instead.
    # fileSearch: true
    # Privacy policy settings
    # privacyPolicy:
    #   externalUrl: 'https://example.com/privacy-policy'
    #   openNewTab: true

    # Terms of service
    # termsOfService:
    #   externalUrl: 'https://example.com/tos'
    #   openNewTab: true
    #   modalAcceptance: true
    #   modalTitle: 'Terms of Service'
    #   modalContent: |
    #     # Your Terms and Conditions
    #
    #     Add your terms of service content here...

    endpointsMenu: true
    modelSelect: true
    # parameters: true
    # sidePanel: true
    presets: true
    prompts: true
    bookmarks: true
    multiConvo: true
    agents: true
    # Default model selection (optional)
    # Option 1: Specify by model spec name
    # defaultModelSpec: "claude-sonnet"
    # Option 2: Specify by provider and model
    defaultProvider: "chatllm"
    defaultModel: "default"
    # peoplePicker:
    #   users: true
    #   groups: true
    #   roles: true
    # marketplace:
    #     use: false
    # fileCitations: true
    # Temporary chat retention period in hours (default: 720, min: 1, max: 8760)
    # temporaryChatRetention: 1

