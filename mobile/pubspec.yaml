name: t3chat_mobile
description: T3Chat mobile Flutter client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.1

  # Networking
  dio: ^5.4.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Logging
  logger: ^2.0.2+1

  # URL Launcher (for OIDC)
  url_launcher: ^6.2.2

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true

