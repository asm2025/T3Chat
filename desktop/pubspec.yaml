name: t3chat_desktop
description: T3Chat Desktop Client
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter

    # State Management
    flutter_riverpod: ^3.1.0

    # Navigation
    go_router: ^17.0.1

    # Rust FFI
    flutter_rust_bridge: ^2.11.1
    ffi: ^2.1.3

    # Utilities
    freezed_annotation: ^3.1.0
    json_annotation: ^4.8.1
    uuid: ^4.3.3
    url_launcher: ^6.3.0
    intl: ^0.20.2
    logger: ^2.0.2+1
    path_provider: ^2.1.2

    # UI
    cupertino_icons: ^1.0.6
    window_manager: ^0.5.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    build_runner: ^2.4.8
    freezed: ^3.2.3
    json_serializable: ^6.7.1

flutter:
    uses-material-design: true
