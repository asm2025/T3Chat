name: t3chat_client
description: T3Chat Client (Desktop & Mobile)
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ">=3.8.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter

    # State Management
    flutter_riverpod: ^3.1.0
    riverpod_annotation: ^4.0.0

    # Navigation
    go_router: ^17.0.1

    # Rust FFI (Desktop only)
    flutter_rust_bridge: ^2.11.1
    ffi: ^2.1.3

    # Networking (Mobile)
    dio: ^5.4.0

    # Secure Storage (Mobile)
    flutter_secure_storage: ^10.0.0

    # Utilities
    freezed_annotation: ^3.1.0
    json_annotation: ^4.9.0
    uuid: ^4.3.3
    url_launcher: ^6.3.0
    intl: ^0.20.2
    logger: ^2.0.2+1
    path_provider: ^2.1.2
    shared_preferences: ^2.2.2

    # UI
    cupertino_icons: ^1.0.6
    window_manager: ^0.5.1
    flutter_markdown: ^0.7.4

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    build_runner: ^2.4.8
    freezed: ^3.2.3
    json_serializable: ^6.7.1
    riverpod_generator: ^4.0.0+1

flutter:
    uses-material-design: true
